<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2+CF 极速个人网盘</title>
<style>
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial; background: #f6f8fa; color: #24292f; }
.header { background: #0052cc; color: white; padding: 14px 20px; font-weight: 600; font-size: 18px; }
.container { max-width: 1000px; margin: 20px auto; display: grid; gap: 16px; padding: 0 10px; }
.card { background: white; border: 1px solid #d0d7de; border-radius: 10px; padding: 16px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px; border: 1px solid #d0d7de; background: #f6f8fa; color: #24292f; cursor: pointer; font-size: 13px; font-weight: 500; text-decoration: none; }
.btn:hover { background: #eef1f4; }
.btn-danger { color: #cf222e; } .btn-danger:hover { background: #fff1f2; border-color: #ffccd1; }
.btn-primary { color: white; background: #0052cc; border: 1px solid #0043a4; } .btn-primary:hover { background: #0043a4; }
.path-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid #d0d7de; }
.file { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eaeef2; }
.file:hover { background: #f6f8fa; }
.actions { display: flex; gap: 8px; }
.upload-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input[type="file"] { display: none; }
.progress { margin-top: 12px; height: 8px; background: #eaeef2; border-radius: 6px; overflow: hidden; }
.progress-bar { height: 100%; width: 0%; background: #0052cc; transition: width 0.2s; }
.status { margin-top: 10px; font-family: monospace; font-size: 13px; color: #57606a; }
</style>
</head>
<body>

<div class="header">🚀 我的私有云盘（B2 + CF 架构）</div>

<div class="container">
  <div class="card">
    <div class="upload-box">
      <label for="fileInput" class="btn">选择文件</label>
      <input type="file" id="fileInput">
      <button class="btn btn-primary" onclick="upload()">上传到当前目录</button>
      <button class="btn" onclick="createFolderPrompt()">新建文件夹</button>
      <button class="btn" onclick="loadFiles()">🔄 刷新</button>
    </div>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div class="status" id="status">状态：等待操作</div>
  </div>

  <div class="card">
    <div class="path-bar">
      <b id="pathDisplay">📁 当前目录: /</b>
      <button class="btn" id="backBtn" onclick="goBack()" style="display: none;">⬅️ 返回上一级</button>
    </div>
    <div id="fileList"></div>
  </div>
</div>

<script>
// ⚠️ 记得配置下面两个为你自己的实际 Worker 域名和 CF 绑定的下载子域名
const API = "https://你的worker名字.子域名.workers.dev"; 
const DOWNLOAD_DOMAIN = "https://file.chenyurong.qzz.io";

let allFiles = [];    
let currentPath = ""; 

function setStatus(msg) { document.getElementById("status").textContent = "状态：" + msg; }
function setProgress(v) { document.getElementById("progressBar").style.width = v + "%"; }

// 加载文件列表
async function loadFiles() {
  setStatus("正在获取文件列表...");
  try {
    const res = await fetch(`${API}/api/files`);
    allFiles = await res.json();
    renderFiles();
    setStatus("列表刷新成功");
  } catch (e) {
    setStatus("获取列表失败，请检查后端 Worker 运行状态");
  }
}

// 核心：基于标准路径解析虚拟目录
function renderFiles() {
  document.getElementById("pathDisplay").textContent = `📁 当前目录: /${currentPath}`;
  document.getElementById("backBtn").style.display = currentPath === "" ? "none" : "inline-flex";

  const box = document.getElementById("fileList");
  box.innerHTML = "";

  const folders = new Set();
  const filesInDir = [];

  allFiles.forEach(f => {
    let name = f.name;
    if (!name.startsWith(currentPath)) return;

    const relativePath = name.slice(currentPath.length);
    if (!relativePath) return; 

    const slashIndex = relativePath.indexOf("/");
    if (slashIndex !== -1) {
      const folderName = relativePath.slice(0, slashIndex);
      if (folderName) folders.add(folderName);
    } else {
      if (relativePath !== ".placeholder") {
        filesInDir.push({ id: f.id, rawName: f.name, displayName: relativePath });
      }
    }
  });

  // 渲染文件夹
  folders.forEach(folder => {
    const div = document.createElement("div");
    div.className = "file";
    div.innerHTML = `
      <div style="cursor: pointer; font-weight: 600; color: #0052cc;" onclick="enterFolder('${folder}')">📁 ${folder}</div>
      <div class="actions"><button class="btn btn-danger" onclick="deleteFolder('${folder}')">删除文件夹</button></div>
    `;
    box.appendChild(div);
  });

  // 渲染文件
  filesInDir.forEach(f => {
    const div = document.createElement("div");
    div.className = "file";
    // ✨ 核心改变：下载直接走绑定的 file 域名直连，不经过 Worker 转发，享受 CF 免费 CDN 加速
    const downloadUrl = `${DOWNLOAD_DOMAIN}/${encodeURIComponent(f.rawName)}`;
    div.innerHTML = `
      <div>📄 ${f.displayName}</div>
      <div class="actions">
        <a class="btn" href="${downloadUrl}" target="_blank" download>下载</a>
        <button class="btn btn-danger" onclick="del('${f.id}', '${f.rawName}')">删除</button>
      </div>
    `;
    box.appendChild(div);
  });

  if (folders.size === 0 && filesInDir.length === 0) {
    box.innerHTML = `<div style="color: #57606a; text-align: center; padding: 20px;">此文件夹为空</div>`;
  }
}

function enterFolder(folderName) { currentPath += folderName + "/"; renderFiles(); }
function goBack() {
  const segments = currentPath.split("/").filter(Boolean);
  segments.pop();
  currentPath = segments.length === 0 ? "" : segments.join("/") + "/";
  renderFiles();
}

// 创建文件夹（创建占位符文件）
function createFolderPrompt() {
  const folderName = prompt("请输入文件夹名称:");
  if (!folderName || !folderName.trim()) return;
  const targetName = currentPath + folderName.trim() + "/.placeholder";

  setStatus("正在创建文件夹...");
  const fd = new FormData();
  fd.append("file", new Blob([""], { type: "text/plain" }), targetName);

  fetch(`${API}/api/upload`, { method: "POST", body: fd })
    .then(() => { setProgress(100); setStatus("文件夹创建成功"); loadFiles(); });
}

// 上传文件
async function upload() {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return alert("请先选择文件");

  const targetName = currentPath + file.name;
  setStatus("准备上传：" + file.name);

  const fd = new FormData();
  fd.append("file", file, targetName);

  setProgress(50); // 原生 fetch 不易做进度条，这里给一个加载隐喻
  try {
    const res = await fetch(`${API}/api/upload`, { method: "POST", body: fd });
    if (res.ok) {
      setProgress(100); setStatus("上传成功！"); loadFiles();
    } else { setStatus("上传失败"); }
  } catch { setStatus("网络错误，上传失败"); }
}

// 删除单个文件
async function del(id, rawName) {
  if (!confirm("确定删除该文件吗？")) return;
  setStatus("正在删除...");
  // 将原文件名作为 Query 参数带过去
  await fetch(`${API}/api/delete/${id}?name=${encodeURIComponent(rawName)}`, { method: "DELETE" });
  loadFiles();
}

// 删除整个文件夹
async function deleteFolder(folder) {
  if (!confirm(`确定彻底删除文件夹 "${folder}" 及其内部的所有文件吗？`)) return;
  const prefix = currentPath + folder + "/";
  const targets = allFiles.filter(f => f.name.startsWith(prefix));

  setStatus(`正在清空文件夹中的 ${targets.length} 个文件...`);
  for (const f of targets) {
    await fetch(`${API}/api/delete/${f.id}?name=${encodeURIComponent(f.name)}`, { method: "DELETE" });
  }
  loadFiles();
}

// 初始化
loadFiles();
</script>
</body>
</html>
