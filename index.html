<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人网盘</title>

<style>
body { margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";background:#f6f8fa;color:#24292f;}
.header{background:#24292f;color:white;padding:14px 20px;font-weight:600;}
.container{max-width:1000px;margin:20px auto;display:grid;gap:16px;}
.card{background:white;border:1px solid #d0d7de;border-radius:10px;padding:16px;}
.btn{padding:6px 12px;border:1px solid #d0d7de;background:#f6f8fa;border-radius:6px;cursor:pointer;}
.btn-primary{color:#1a7f37;}
.btn-danger{color:#cf222e;}
.file{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee;}
.upload-box{display:flex;gap:10px;}
input{padding:6px;}
.progress{height:8px;background:#eee;border-radius:6px;margin-top:10px;}
.progress-bar{height:100%;width:0;background:#2da44e;}
.log{font-family:monospace;font-size:12px;white-space:pre-wrap;}
</style>
</head>

<body>

<div class="header">个人网盘（登录版）</div>

<div class="container">

<!-- 登录 -->
<div class="card" id="loginBox">
  <b>登录</b><br><br>
  <input id="username" placeholder="用户名"><br><br>
  <input id="password" type="password" placeholder="密码"><br><br>
  <button class="btn btn-primary" onclick="login()">登录</button>
</div>

<!-- 主功能 -->
<div class="card" id="mainBox" style="display:none">

  <div class="upload-box">
    <input type="file" id="fileInput">
    <button class="btn btn-primary" onclick="upload()">上传</button>
    <button class="btn" onclick="loadFiles()">刷新</button>
    <button class="btn" onclick="logout()">退出</button>
  </div>

  <div class="progress"><div class="progress-bar" id="bar"></div></div>

</div>

<div class="card">
  <b>文件列表</b>
  <div id="list"></div>
</div>

<div class="card">
  <b>日志</b>
  <div class="log" id="log"></div>
</div>

</div>

<script>

const API = "https://api.chenyurong.qzz.io"
let TOKEN = localStorage.getItem("token")

function log(m){document.getElementById("log").textContent += m + "\n"}

function showMain(){
  document.getElementById("loginBox").style.display = "none"
  document.getElementById("mainBox").style.display = "block"
}

if(TOKEN) showMain()

async function login(){
  const username = document.getElementById("username").value
  const password = document.getElementById("password").value

  const res = await fetch(API + "/api/login", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({username,password})
  })

  const data = await res.json()

  if(data.token){
    TOKEN = data.token
    localStorage.setItem("token",TOKEN)
    showMain()
    loadFiles()
  } else {
    alert("登录失败")
  }
}

function authHeader(){
  return { Authorization: TOKEN }
}

async function loadFiles(){
  const res = await fetch(API + "/api/files", {
    headers: authHeader()
  })

  const data = await res.json()

  const box = document.getElementById("list")
  box.innerHTML = ""

  data.forEach(f=>{
    const div = document.createElement("div")
    div.className = "file"
    div.innerHTML = `
      <div>📄 ${decodeURIComponent(f.name)}</div>
      <div>
        <a class="btn" href="${API}/api/download/${f.id}" onclick="this.href+='?t='+TOKEN">下载</a>
        <button class="btn btn-danger" onclick="del('${f.id}')">删除</button>
      </div>
    `
    box.appendChild(div)
  })
}

async function upload(){
  const file = document.getElementById("fileInput").files[0]
  if(!file) return

  const fd = new FormData()
  fd.append("file",file,file.name)

  const xhr = new XMLHttpRequest()
  xhr.open("POST", API + "/api/upload")
  xhr.setRequestHeader("Authorization", TOKEN)

  xhr.upload.onprogress = e=>{
    if(e.lengthComputable){
      document.getElementById("bar").style.width =
        (e.loaded/e.total*100)+"%"
    }
  }

  xhr.onload = ()=>{
    loadFiles()
  }

  xhr.send(fd)
}

async function del(id){
  await fetch(API + "/api/delete/"+id,{
    method:"DELETE",
    headers: authHeader()
  })
  loadFiles()
}

function logout(){
  localStorage.removeItem("token")
  location.reload()
}

loadFiles()

</script>

</body>
</html>
