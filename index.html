<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私有网盘</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial;
  background: #f6f8fa;
  color: #24292f;
}

/* 顶栏 */
.header {
  background: #24292f;
  color: white;
  padding: 14px 20px;
  font-size: 16px;
  font-weight: 600;
}

/* 主容器 */
.container {
  max-width: 1000px;
  margin: 20px auto;
  display: grid;
  gap: 16px;
}

/* 卡片 */
.card {
  background: white;
  border: 1px solid #d0d7de;
  border-radius: 10px;
  padding: 16px;
}

/* 上传区 */
.upload-box {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* 按钮 */
button {
  background: #2da44e;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
}

button:hover {
  opacity: 0.9;
}

button.delete {
  background: #cf222e;
}

button.download {
  background: #0969da;
}

/* 进度条 */
.progress {
  width: 100%;
  height: 8px;
  background: #eaeef2;
  border-radius: 6px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #2da44e;
  transition: width 0.2s;
}

/* 文件列表 */
.file {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  border-bottom: 1px solid #eaeef2;
}

.file:hover {
  background: #f6f8fa;
}

.actions {
  display: flex;
  gap: 8px;
}

/* =========================
   日志（重点修改）
   ========================= */
.log {
  font-size: 13px;
  font-family: monospace;
  color: #57606a;
  white-space: pre-wrap;      /* ✔ 自动换行 */
  word-break: break-word;     /* ✔ 防止超宽 */
  line-height: 1.4;
}

/* 当前状态行（只更新这一行） */
.status-line {
  font-family: monospace;
  font-size: 13px;
  color: #24292f;
  margin-bottom: 8px;
}
</style>
</head>

<body>

<div class="header">📦 私有网盘（GitHub Releases）</div>

<div class="container">

  <!-- 上传 -->
  <div class="card">

    <div class="upload-box">
      <input type="file" id="fileInput">
      <button onclick="upload()">上传文件</button>
      <button onclick="loadFiles()">刷新</button>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- ✔ 当前状态（重点：不刷屏，只更新这里） -->
    <div class="status-line" id="status">状态：等待操作</div>

  </div>

  <!-- 文件列表 -->
  <div class="card">
    <b>📁 文件列表</b>
    <div id="fileList"></div>
  </div>

  <!-- ✔ 日志区（移到最底部 + 无背景） -->
  <div class="card">
    <b>📡 日志</b>
    <div class="log" id="log"></div>
  </div>

</div>

<script>

const API = "https://api.chenyurong.qzz.io"

// =========================
// 日志（只追加，不刷屏）
// =========================
function log(msg) {
  const box = document.getElementById("log")
  box.textContent += msg + "\n"
  box.scrollTop = box.scrollHeight
}

// =========================
// 状态行（只更新一行）
// =========================
function setStatus(msg) {
  document.getElementById("status").textContent = "状态：" + msg
}

// =========================
// 进度条
// =========================
function setProgress(v) {
  document.getElementById("progressBar").style.width = v + "%"
}

// =========================
// 文件列表
// =========================
async function loadFiles() {

  setStatus("正在加载文件列表...")
  log("📥 请求文件列表")

  const res = await fetch(`${API}/api/files`)
  const files = await res.json()

  const box = document.getElementById("fileList")
  box.innerHTML = ""

  files.forEach(f => {

    const div = document.createElement("div")
    div.className = "file"

    div.innerHTML = `
      <div>📄 ${f.name}</div>
      <div class="actions">
        <a href="${API}/api/download/${f.id}">
          <button class="download">下载</button>
        </a>
        <button class="delete" onclick="del('${f.id}')">删除</button>
      </div>
    `

    box.appendChild(div)
  })

  setStatus("文件列表已更新")
  log("✅ 文件加载完成")
}

// =========================
// 上传（重点优化：进度不刷屏）
// =========================
async function upload() {

  const file = document.getElementById("fileInput").files[0]

  if (!file) {
    setStatus("未选择文件")
    return
  }

  setStatus("开始上传：" + file.name)
  log("🚀 上传：" + file.name)

  const formData = new FormData()
  formData.append("file", file)

  const xhr = new XMLHttpRequest()
  xhr.open("POST", `${API}/api/upload`)

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const percent = Math.round((e.loaded / e.total) * 100)

      setProgress(percent)

      // ✔ 关键：不再追加日志，只更新状态行
      setStatus(`上传中 ${percent}%`)
    }
  }

  xhr.onload = () => {
    setProgress(100)

    setStatus("上传完成")
    log("✅ 上传成功")

    loadFiles()
  }

  xhr.onerror = () => {
    setStatus("上传失败")
    log("❌ 上传失败")
  }

  xhr.send(formData)
}

// =========================
// 删除
// =========================
async function del(id) {

  setStatus("删除文件 " + id)
  log("🗑 删除：" + id)

  await fetch(`${API}/api/delete/${id}`, {
    method: "DELETE"
  })

  loadFiles()
}

// 初始化
loadFiles()

</script>

</body>
</html>
