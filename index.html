<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>私有网盘</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial;
  background: #f6f8fa;
  color: #24292f;
}

.header {
  background: #24292f;
  color: white;
  padding: 14px 20px;
  font-size: 16px;
  font-weight: 600;
}

/* 容器 */
.container {
  max-width: 1000px;
  margin: 20px auto;
  display: grid;
  gap: 16px;
}

/* 卡片 */
.card {
  background: white;
  border: 1px solid #d0d7de;
  border-radius: 10px;
  padding: 16px;
}

/* 上传区 */
.upload-box {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* 隐藏原生 input */
input[type="file"] {
  display: none;
}

/* GitHub风格按钮 */
.btn {
  border: 1px solid #d0d7de;
  background: #f6f8fa;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
}

.btn:hover {
  background: #eef1f4;
}

.btn-primary {
  background: #2da44e;
  color: white;
  border: none;
}

.btn-primary:hover {
  opacity: 0.9;
}

.btn-danger {
  background: #cf222e;
  color: white;
  border: none;
}

.btn-blue {
  background: #0969da;
  color: white;
  border: none;
}

/* 进度条区域（增加间距） */
.progress-wrap {
  margin-top: 12px;
}

.progress {
  width: 100%;
  height: 8px;
  background: #eaeef2;
  border-radius: 6px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #2da44e;
  transition: width 0.2s;
}

/* 状态（与进度分离） */
.status-line {
  margin-top: 12px;
  font-family: monospace;
  font-size: 13px;
  color: #24292f;
}

/* 文件列表 */
.file {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px;
  border-bottom: 1px solid #eaeef2;
}

.file:hover {
  background: #f6f8fa;
}

.actions {
  display: flex;
  gap: 8px;
}

/* 日志（无背景 + 可换行） */
.log {
  font-size: 13px;
  font-family: monospace;
  color: #57606a;
  white-space: pre-wrap;
  word-break: break-word;
  line-height: 1.4;
}

/* 日志头部 */
.log-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
</style>
</head>

<body>

<div class="header">个人网盘</div>

<div class="container">

  <!-- 上传 -->
  <div class="card">

    <div class="upload-box">

      <!-- ✔ 自定义按钮 -->
      <label for="fileInput" class="btn">📂 选择文件</label>
      <input type="file" id="fileInput">

      <button class="btn-primary" onclick="upload()">上传</button>
      <button class="btn" onclick="loadFiles()">刷新</button>

    </div>

    <!-- ✔ 进度 -->
    <div class="progress-wrap">
      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <!-- ✔ 状态与进度分离 -->
      <div class="status-line" id="status">状态：等待操作</div>
    </div>

  </div>

  <!-- 文件列表 -->
  <div class="card">
    <b>📁 文件列表</b>
    <div id="fileList"></div>
  </div>

  <!-- 日志 -->
  <div class="card">

    <div class="log-header">
      <b>📡 日志</b>
      <button class="btn" onclick="clearLog()">清空日志</button>
    </div>

    <div class="log" id="log"></div>
  </div>

</div>

<script>

const API = "https://api.chenyurong.qzz.io"

// =========================
// 日志
// =========================
function log(msg) {
  const box = document.getElementById("log")
  box.textContent += msg + "\n"
  box.scrollTop = box.scrollHeight
}

function clearLog() {
  document.getElementById("log").textContent = ""
}

// =========================
// 状态
// =========================
function setStatus(msg) {
  document.getElementById("status").textContent = "状态：" + msg
}

// =========================
// 进度
// =========================
function setProgress(v) {
  document.getElementById("progressBar").style.width = v + "%"
}

// =========================
// 文件列表
// =========================
async function loadFiles() {

  setStatus("加载文件列表...")

  const res = await fetch(`${API}/api/files`)
  const files = await res.json()

  const box = document.getElementById("fileList")
  box.innerHTML = ""

  files.forEach(f => {

    const div = document.createElement("div")
    div.className = "file"

    div.innerHTML = `
      <div>📄 ${f.name}</div>
      <div class="actions">
        <a href="${API}/api/download/${f.id}">
          <button class="btn-blue">下载</button>
        </a>
        <button class="btn-danger" onclick="del('${f.id}')">删除</button>
      </div>
    `

    box.appendChild(div)
  })

  setStatus("文件列表已更新")
}

// =========================
// 上传
// =========================
async function upload() {

  const file = document.getElementById("fileInput").files[0]
  if (!file) {
    setStatus("未选择文件")
    return
  }

  setStatus("开始上传：" + file.name)
  log("↑ 上传：" + file.name)

  const fd = new FormData()
  fd.append("file", file)

  const xhr = new XMLHttpRequest()
  xhr.open("POST", `${API}/api/upload`)

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const p = Math.round((e.loaded / e.total) * 100)
      setProgress(p)
      setStatus(`上传中 ${p}%`)
    }
  }

  xhr.onload = () => {
    setProgress(100)
    setStatus("上传完成")
    log("(●'◡'●)上传成功")
    loadFiles()
  }

  xhr.onerror = () => {
    setStatus("上传失败")
    log("/(ㄒoㄒ)/~上传失败")
  }

  xhr.send(fd)
}

// =========================
// 删除
// =========================
async function del(id) {
  setStatus("删除文件")
  log("✕ 删除：" + id)

  await fetch(`${API}/api/delete/${id}`, {
    method: "DELETE"
  })

  loadFiles()
}

// 初始化
loadFiles()

</script>

</body>
</html>
