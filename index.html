<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>私有网盘</title>

<style>
body { font-family: Arial; max-width: 900px; margin: auto; padding: 20px; }
.file { display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #ddd; }
</style>
</head>

<body>

<h2>📁 我的私有网盘</h2>

<input type="file" id="fileInput">
<button onclick="upload()">上传</button>

<hr>

<div id="list"></div>

<script>

const API = "https://api.chenyurong.qzz.io"

async function loadFiles() {

  const res = await fetch(`${API}/api/files`)
  const files = await res.json()

  const list = document.getElementById("list")
  list.innerHTML = ""

  files.forEach(file => {

    const div = document.createElement("div")
    div.className = "file"

    div.innerHTML = `
      <div>📄 ${file.name}</div>
      <div>
        <a href="${API}/api/download/${file.id}">
          <button>下载</button>
        </a>
        <button onclick="del('${file.id}')">删除</button>
      </div>
    `

    list.appendChild(div)
  })
}

async function upload() {

  const file = document.getElementById("fileInput").files[0]
  if (!file) return

  const fd = new FormData()
  fd.append("file", file)

  const res = await fetch(`${API}/api/upload`, {
    method: "POST",
    body: fd
  })

  const data = await res.json()
  alert("上传成功：" + data.name)

  loadFiles()
}

async function del(id) {

  await fetch(`${API}/api/delete/${id}`, {
    method: "DELETE"
  })

  loadFiles()
}

loadFiles()

</script>

</body>
</html>
