<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的下载站</title>

<style>
body {
  margin: 0;
  font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial;
  background: #f6f8fa;
  color: #24292f;
}

.header {
  background: #24292f;
  color: white;
  padding: 14px 20px;
  font-size: 16px;
  font-weight: bold;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  background: white;
  border: 1px solid #d0d7de;
  border-radius: 8px;
}

.toolbar {
  padding: 12px;
  border-bottom: 1px solid #d0d7de;
  display: flex;
  gap: 10px;
  align-items: center;
}

input[type="file"] {
  font-size: 14px;
}

button {
  background: #2da44e;
  color: white;
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
}

button.delete {
  background: #cf222e;
}

.file-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.file-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid #d0d7de;
}

.file-item:hover {
  background: #f6f8fa;
}

.file-name {
  font-weight: 500;
}

.actions {
  display: flex;
  gap: 8px;
}

a {
  text-decoration: none;
  color: #0969da;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="header">
我的下载站
</div>

<div class="container">

  <div class="toolbar">
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>
    <button onclick="loadFiles()">Refresh</button>
  </div>

  <ul id="fileList" class="file-list"></ul>

</div>

<script>

// ===== API 地址 =====
const API = "https://api.chenyurong.qzz.io"

// =========================
// 加载文件列表
// =========================
async function loadFiles() {

  const res = await fetch(`${API}/api/files`)
  const data = await res.json()

  const list = document.getElementById("fileList")
  list.innerHTML = ""

  data.forEach(file => {

    const path = encodeURIComponent(file.path || file.name)

    const li = document.createElement("li")
    li.className = "file-item"

    li.innerHTML = `
      <div class="file-name">📄 ${file.name}</div>

      <div class="actions">

        <a href="${API}/api/download/${path}">
          下载
        </a>

        <button class="delete" onclick="deleteFile('${path}')">
          Delete
        </button>

      </div>
    `

    list.appendChild(li)
  })
}

// =========================
// 上传文件
// =========================
async function uploadFile() {

  const file = document.getElementById("fileInput").files[0]

  if (!file) {
    alert("请选择文件")
    return
  }

  const formData = new FormData()
  formData.append("file", file)

  const res = await fetch(`${API}/api/upload`, {
    method: "POST",
    body: formData
  })

  alert(await res.text())
  loadFiles()
}

// =========================
// 删除文件
// =========================
async function deleteFile(path) {

  if (!confirm("确认删除该文件？")) return

  const res = await fetch(`${API}/api/delete/${path}`, {
    method: "DELETE"
  })

  alert(await res.text())
  loadFiles()
}

// 初始化
loadFiles()

</script>

</body>
</html>
