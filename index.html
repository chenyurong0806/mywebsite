<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Drive</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f8f9fa;
}

.top{
  background:#1a73e8;
  color:white;
  padding:12px;
  font-weight:bold;
}

.container{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  padding:12px;
  border-radius:8px;
  margin-bottom:12px;
}

.file{
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #eee;
}
</style>
</head>

<body>

<div class="top">My Drive</div>

<div class="container">

  <div class="card">
    <input type="file" id="f">
    <button onclick="upload()">Upload</button>
  </div>

  <div class="card" id="list"></div>

</div>

<script>

const API="https://api.chenyurong.qzz.io"

async function load(){

  let r=await fetch(API+"/api/files")
  let d=await r.json()

  let box=document.getElementById("list")
  box.innerHTML=""

  d.forEach(f=>{

    let div=document.createElement("div")
    div.className="file"

    div.innerHTML=`
      <div>${f.name}</div>
      <div>
        <a href="${API}/api/download/${f.id}">下载</a>
        <button onclick="del('${f.id}')">删除</button>
      </div>
    `

    box.appendChild(div)
  })
}

async function upload(){

  let file=document.getElementById("f").files[0]
  let fd=new FormData()
  fd.append("file",file)

  await fetch(API+"/api/upload",{method:"POST",body:fd})

  load()
}

async function del(id){

  await fetch(API+"/api/delete/"+id,{method:"DELETE"})
  load()
}

load()

</script>

</body>
</html>
