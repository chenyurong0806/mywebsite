<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>私有网盘</title>

<style>
body { font-family: Arial; max-width: 900px; margin: auto; padding: 20px; }
.file { display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #ddd; }
</style>
</head>

<body>

<h2>📁 我的私有网盘</h2>

<input type="file" id="fileInput">
<button onclick="upload()">上传</button>

<hr>

<div id="list"></div>

<div id="progress" style="margin-top:10px;color:#2da44e;"></div>
  
<script>

const API = "https://api.chenyurong.qzz.io"

async function loadFiles() {

  const res = await fetch(`${API}/api/files`)
  const files = await res.json()

  const list = document.getElementById("list")
  list.innerHTML = ""

  files.forEach(file => {

    const div = document.createElement("div")
    div.className = "file"

    div.innerHTML = `
      <div>📄 ${file.name}</div>
      <div>
        <a href="${API}/api/download/${file.id}">
          <button>下载</button>
        </a>
        <button onclick="del('${file.id}')">删除</button>
      </div>
    `

    list.appendChild(div)
  })
}

<script>

const API = "https://api.chenyurong.qzz.io"

// =========================
// 上传（带进度条）
// =========================
function upload() {

  const file = document.getElementById("fileInput").files[0]
  if (!file) return alert("请选择文件")

  const fd = new FormData()
  fd.append("file", file)

  const xhr = new XMLHttpRequest()

  xhr.open("POST", `${API}/api/upload`)

  // =========================
  // 上传进度
  // =========================
  xhr.upload.onprogress = function (event) {
    if (event.lengthComputable) {
      const percent = Math.round((event.loaded / event.total) * 100)
      console.log("上传进度:", percent + "%")

      // 👉 如果你想显示到页面（可选）
      document.getElementById("progress").innerText =
        "上传进度：" + percent + "%"
    }
  }

  // =========================
  // 完成
  // =========================
  xhr.onload = function () {
    if (xhr.status === 200) {
      alert("上传成功")
      loadFiles()
      document.getElementById("progress").innerText = ""
    } else {
      alert("上传失败：" + xhr.responseText)
    }
  }

  xhr.onerror = function () {
    alert("网络错误")
  }

  xhr.send(fd)
}

async function del(id) {

  await fetch(`${API}/api/delete/${id}`, {
    method: "DELETE"
  })

  loadFiles()
}

loadFiles()

</script>

</body>
</html>
