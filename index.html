<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人网盘</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial;
  background: #f6f8fa;
  color: #24292f;
}

/* 顶栏 */
.header {
  background: #24292f;
  color: white;
  padding: 14px 20px;
  font-weight: 600;
}

/* 容器 */
.container {
  max-width: 1000px;
  margin: 20px auto;
  display: grid;
  gap: 16px;
}

/* 卡卡片 */
.card {
  background: white;
  border: 1px solid #d0d7de;
  border-radius: 10px;
  padding: 16px;
}

/* =========================
   GitHub统一按钮系统
   ========================= */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;

  padding: 6px 12px;
  border-radius: 6px;

  border: 1px solid #d0d7de;
  background: #f6f8fa;
  color: #24292f;

  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
}

.btn:hover {
  background: #eef1f4;
}

.btn-danger {
  color: #cf222e;
}

.btn-danger:hover {
  background: #fff1f2;
  border-color: #ffccd1;
}

.btn-primary {
  color: #1a7f37;
}

.btn-primary:hover {
  background: #dafbe1;
  border-color: #a3e4b0;
}

/* 路径导航样式 */
.path-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid #d0d7de;
}

/* 文件列表 */
.file {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 10px;
  border-bottom: 1px solid #eaeef2;
}

.file:hover {
  background: #f6f8fa;
}

.actions {
  display: flex;
  gap: 8px;
}

/* 上传区 */
.upload-box {
  display: flex;
  gap: 10px;
  align-items: center;
}

/* 隐藏原生 input */
input[type="file"] {
  display: none;
}

/* 进度条 */
.progress {
  margin-top: 12px;
  height: 8px;
  background: #eaeef2;
  border-radius: 6px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #2da44e;
  transition: width 0.2s;
}

/* 状态 */
.status {
  margin-top: 10px;
  font-family: monospace;
  font-size: 13px;
  color: #57606a;
}

/* 日志 */
.log {
  font-family: monospace;
  font-size: 13px;
  color: #57606a;

  white-space: pre-wrap;
  word-break: break-word;
}
</style>
</head>

<body>

<div class="header">个人网盘（GitHub Releases）</div>

<div class="container">

  <div class="card">
    <div class="upload-box">
      <label for="fileInput" class="btn">选择文件</label>
      <input type="file" id="fileInput">

      <button class="btn btn-primary" onclick="upload()">上传到当前目录</button>
      <button class="btn" onclick="createFolderPrompt()">新建文件夹</button>
      <button class="btn" onclick="loadFiles()">刷新</button>
    </div>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status" id="status">状态：等待操作</div>
  </div>

  <div class="card">
    <div class="path-bar">
      <b id="pathDisplay">📁 当前目录: /</b>
      <button class="btn" id="backBtn" onclick="goBack()" style="display: none;">⬅️ 返回上一级</button>
    </div>
    <div id="fileList"></div>
  </div>

  <div class="card">
    <b>📡 日志</b>
    <div class="log" id="log"></div>
  </div>

</div>

<script>

const API = "https://api.chenyurong.qzz.io"

// 全局状态管理
let allFiles = [];    // 缓存从后端获取的所有原始文件数据
let currentPath = ""; // 当前所在的虚拟路径，例如 "" 或 "documents/" 或 "documents/photos/"

// =========================
// 日志
// =========================
function log(msg) {
  const box = document.getElementById("log")
  box.textContent += msg + "\n"
  box.scrollTop = box.scrollHeight
}

// =========================
// 状态
// =========================
function setStatus(msg) {
  document.getElementById("status").textContent = "状态：" + msg
}

// =========================
// 进度
// =========================
function setProgress(v) {
  document.getElementById("progressBar").style.width = v + "%"
}

// =========================
// 加载文件列表（核心数据拉取）
// =========================
async function loadFiles() {
  setStatus("正在获取文件列表...");
  try {
    const res = await fetch(`${API}/api/files`)
    allFiles = await res.json()
    renderFiles()
    setStatus("加载完成")
  } catch (e) {
    setStatus("加载失败")
    log("/(ㄒoㄒ)/~ 获取文件列表服务异常")
  }
}

// =========================
// 渲染文件列表（纯前端虚拟目录解析）
// =========================
function renderFiles() {
  // 1. 更新路径面包屑与返回按钮状态
  document.getElementById("pathDisplay").textContent = `📁 当前目录: /${currentPath}`
  document.getElementById("backBtn").style.display = currentPath === "" ? "none" : "inline-flex"

  const box = document.getElementById("fileList")
  box.innerHTML = ""

  const folders = new Set()
  const filesInDir = []

  // 2. 过滤并归类当前目录下的文件与子文件夹
  allFiles.forEach(f => {
    const name = decodeURIComponent(f.name)
    
    // 检查文件是否属于当前路径前缀
    if (!name.startsWith(currentPath)) return

    const relativePath = name.slice(currentPath.length)
    // 忽略路径自身或隐藏的空文件夹占位符
    if (!relativePath || relativePath === ".placeholder") return

    const slashIndex = relativePath.indexOf("/")
    if (slashIndex !== -1) {
      // 提取一级子文件夹名
      const folderName = relativePath.slice(0, slashIndex)
      folders.add(folderName)
    } else {
      // 属于当前目录的直接文件
      filesInDir.push(f)
    }
  })

  // 3. 渲染子文件夹
  folders.forEach(folder => {
    const div = document.createElement("div")
    div.className = "file"
    div.innerHTML = `
      <div style="cursor: pointer; font-weight: 600; color: #0969da; display: flex; align-items: center; gap: 6px;" onclick="enterFolder('${folder}')">
        📁 ${folder}
      </div>
      <div class="actions">
        <button class="btn btn-danger" onclick="deleteFolder('${folder}')">
          删除文件夹
        </button>
      </div>
    `
    box.appendChild(div)
  })

  // 4. 渲染直接文件
  filesInDir.forEach(f => {
    const name = decodeURIComponent(f.name)
    const displayName = name.slice(currentPath.length) // 仅展示纯文件名

    const div = document.createElement("div")
    div.className = "file"
    div.innerHTML = `
      <div>📄 ${displayName}</div>
      <div class="actions">
        <a class="btn" href="${API}/api/download/${f.id}">下载</a>
        <button class="btn btn-danger" onclick="del('${f.id}')">删除</button>
      </div>
    `
    box.appendChild(div)
  })

  // 空白提示
  if (folders.size === 0 && filesInDir.length === 0) {
    box.innerHTML = `<div style="color: #57606a; text-align: center; padding: 20px; font-size: 13px;">此文件夹为空</div>`
  }
}

// =========================
// 目录导航控制
// =========================
function enterFolder(folderName) {
  currentPath += folderName + "/";
  renderFiles();
}

function goBack() {
  if (currentPath === "") return;
  const segments = currentPath.split("/").filter(Boolean);
  segments.pop();
  currentPath = segments.length === 0 ? "" : segments.join("/") + "/";
  renderFiles();
}

// =========================
// 创建文件夹
// =========================
function createFolderPrompt() {
  const folderName = prompt("请输入文件夹名称:")
  if (!folderName) return
  const trimmed = folderName.trim()
  if (!trimmed) return
  if (trimmed.includes("/")) {
    alert("文件夹名称不能包含 '/' 字符");
    return
  }

  setStatus("正在创建文件夹：" + trimmed)
  log("📁 创建文件夹：" + trimmed)

  // 核心黑科技：利用 0 字节的 .placeholder 文件在 GitHub 侧维持这个“虚拟目录”
  const fd = new FormData()
  const blob = new Blob([""], { type: "text/plain" })
  fd.append("file", blob, currentPath + trimmed + "/.placeholder")

  const xhr = new XMLHttpRequest()
  xhr.open("POST", `${API}/api/upload`)

  xhr.onload = () => {
    setProgress(100)
    setStatus("文件夹创建成功")
    log("(●'◡'●) 文件夹 [" + trimmed + "] 创建成功")
    loadFiles()
  }

  xhr.onerror = () => {
    setStatus("文件夹创建失败")
    log("/(ㄒoㄒ)/~ 文件夹创建失败")
  }

  xhr.send(fd)
}

// =========================
// 上传（注入虚拟路径）
// =========================
async function upload() {
  const file = document.getElementById("fileInput").files[0]
  if (!file) return

  const targetName = currentPath + file.name;
  setStatus("上传：" + targetName)
  log("↑ 上传：" + targetName)

  const fd = new FormData()
  // 通过第三个参数，强行重写文件名为带路径的虚拟全路径
  fd.append("file", file, targetName)

  const xhr = new XMLHttpRequest()
  xhr.open("POST", `${API}/api/upload`)

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const p = Math.round((e.loaded / e.total) * 100)
      setProgress(p)
      setStatus("上传中 " + p + "%")
    }
  }

  xhr.onload = () => {
    setProgress(100)
    setStatus("上传完成")
    log("(●'◡'●)上传成功")
    loadFiles()
  }

  xhr.onerror = () => {
    setStatus("上传失败")
    log("/(ㄒoㄒ)/~上传失败")
  }

  xhr.send(fd)
}

// =========================
// 删除单文件
// =========================
async function del(id) {
  if (!confirm("确定要删除该文件吗？")) return
  setStatus("删除中...")
  log("✕ 删除资产ID：" + id)

  await fetch(`${API}/api/delete/${id}`, {
    method: "DELETE"
  })
  loadFiles()
}

// =========================
// 删除整个文件夹（级联删除）
// =========================
async function deleteFolder(folder) {
  if (!confirm(`警告：确定要彻底删除文件夹 "${folder}" 及其内部的所有文件吗？此操作不可逆！`)) return

  const prefix = currentPath + folder + "/"
  // 揪出所有隶属于该虚拟路径下的 GitHub 资产
  const targets = allFiles.filter(f => {
    const name = decodeURIComponent(f.name)
    return name.startsWith(prefix)
  })

  setStatus(`正在级联删除文件夹，共 ${targets.length} 个对象...`)
  log(`✕ 开始清空文件夹: ${folder}`)

  // 循环调用后端单个删除
  for (const f of targets) {
    const name = decodeURIComponent(f.name)
    log(`✕ 正在擦除: ${name}`)
    await fetch(`${API}/api/delete/${f.id}`, { method: "DELETE" })
  }

  setStatus("文件夹删除完毕")
  log("(●'◡'●) 文件夹及其内部所有实体已清理干净")
  loadFiles()
}

// 初始化
loadFiles()

</script>
</body>
</html>
